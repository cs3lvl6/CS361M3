<style>

  { q: "16. Which of the following is provided as an example of analog data?",

  { q: "17. Which characteristic describes an analog signal?",

  { q: "18. Which characteristic describes a digital signal?",

  { q: "20. What is a cycle in the context of a periodic signal?",

  { q: "21. What does the period (T) of a signal refer to?",

  { q: "23. Which types of signals can be periodic or nonperiodic?",

  { q: "24. What is the most fundamental form of a periodic analog signal?",

  { q: "25. How is a sine wave visualized over the course of a cycle?",

  { q: "26. What are the three parameters that represent a sine wave?",

  { q: "27. What does the peak amplitude of a signal measure?",

  { q: "28. What property of a signal is proportional to its peak amplitude?",

  { q: "29. What is the standard unit of measurement for the peak amplitude of electric signals?",

  { q: "30. How is frequency defined?",

  { q: "31. What is the standard unit of frequency?",

  { q: "32. What is the equivalent unit for 10^3 Hz?",

  { q: "33. What is the equivalent unit for 10^6 Hz?",

  { q: "34. What is the equivalent unit for 10^9 Hz?",

  { q: "36. What is the equivalent duration for one millisecond (ms)?",

  { q: "37. What is the equivalent duration for one microsecond (us)?",

  { q: "38. What is the equivalent duration for one nanosecond (ns)?",

  { q: "39. What is the equivalent duration for one picosecond (ps)?",

    explanation: "A picosecond (ps) is equivalent to 10^-12 s." },
  { q: "40. How many microseconds (us) are in 100 milliseconds (ms)?",

    explanation: "100 ms is equivalent to 100 × 10^3 μs, which equals 10^5 μs." },
  { q: "41. How many seconds are in 1 minute?",

  { q: "42. How many nanoseconds (ns) are in 1 microsecond (us)?",

    correct: 2,

  { q: "43. What does the term phase, or phase shift, describe?",

  { q: "44. How can phase shift be visualized?",

  { q: "45. In what units is phase measured?",

  { q: "49. What does phase explicitly indicate regarding a waveform?",

  { q: "50. What is the phase in degrees of a sine wave that is shifted 1/6 of a cycle with respect to time 0?",

  { q: "51. What is the phase in radians of a sine wave that is shifted 1/6 of a cycle with respect to time 0?",

    correct: 1,
    explanation: "A shift of 60° equals 60 × 2π/360 rad, which equals π/3 rad or 1.046 rad." },
  { q: "52. What does wavelength measure?",

  { q: "67. What is the definition of bit interval?",

/* ============ Quiz Logic ============ */
const app = document.getElementById('app');
let currentIndex = 0;
let score = 0;
let userAnswers = questions.map(() => ({ selectedIndex: null, answered: false }));

function renderQuestion() {
  const q = questions[currentIndex];
  const total = questions.length;
  const state = userAnswers[currentIndex];

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${currentIndex + 1} of ${total}</span>
      <span class="progress">Score: ${score}</span>
    </div>
    <div class="question">${q.q}</div>
    <div class="options" id="options"></div>
    <div class="explanation ${state.answered ? '' : 'hidden'}" id="explanation">
      <strong>✅ Correct Answer:</strong> ${q.options[q.correct]}<br><br>
      <strong>💡 Explanation:</strong> ${q.explanation}
    </div>
    <div class="nav-buttons">
      <button class="navbtn prevbtn" id="prevBtn" ${currentIndex === 0 ? 'disabled' : ''}>← Previous</button>
      <button class="navbtn nextbtn" id="nextBtn" ${state.answered ? '' : 'disabled'}>
        ${currentIndex === total - 1 ? 'Show Results 🎯' : 'Next →'}
      </button>
    </div>
  `;

  const optionsBox = document.getElementById('options');
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.textContent = opt;

    if (state.answered) {
      div.classList.add('locked');
      if (i === q.correct) {
        div.classList.add('correct');
      } else if (i === state.selectedIndex) {
        div.classList.add('wrong');
      }
    } else {
      div.onclick = () => selectOption(i, div);
    }
    optionsBox.appendChild(div);
  });

  document.getElementById('nextBtn').onclick = nextQuestion;
  document.getElementById('prevBtn').onclick = prevQuestion;
}

function selectOption(index, el) {
  const state = userAnswers[currentIndex];
  if (state.answered) return;

  state.answered = true;
  state.selectedIndex = index;
  const q = questions[currentIndex];
  const allOptions = document.querySelectorAll('.option');
  allOptions.forEach(o => o.classList.add('locked'));

  if (index === q.correct) {
    el.classList.add('correct');
    score++;
  } else {
    el.classList.add('wrong');
    allOptions[q.correct].classList.add('correct');
  }

  document.querySelector('.progress').textContent = `Score: ${score}`;
  document.getElementById('explanation').classList.remove('hidden');
  document.getElementById('nextBtn').disabled = false;
}

function nextQuestion() {
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    showResults();
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
  }
}

function showResults() {
  const total = questions.length;
  app.innerHTML = `
    <div class="final">
      <h2>🎉 Quiz Complete!</h2>
      <p>Your Score: <strong>${score}</strong> out of <strong>${total}</strong></p>
      <p>Percentage: ${Math.round((score / total) * 100)}%</p>
      <button class="restart" id="restartBtn">Restart Quiz ↻</button>
    </div>
  `;
  document.getElementById('restartBtn').onclick = () => {
    currentIndex = 0;
    score = 0;
    userAnswers = questions.map(() => ({ selectedIndex: null, answered: false }));
    renderQuestion();
  };
}

renderQuestion();
</script>
